<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6 - Login</title>
</head>

<body>

    <h1>User Login</h1>

    <form action="/login" method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

    <p>
        New user?
        <a href="/">Register</a>
    </p>

</body>
</html>
