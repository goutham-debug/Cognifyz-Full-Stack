<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 - User Management</title>
</head>

<body>

    <h1>User Management</h1>

    <button onclick="loadUsers()">Load Users</button>

    <div id="users"></div>
    <h2>Add User</h2>

<form id="userForm">
    <input type="text" id="userName" placeholder="Enter name" required>
    <input type="email" id="userEmail" placeholder="Enter email" required>
    <button type="submit">Add User</button>
</form>

<p id="message"></p>

    <script>

    // READ - Load all users
    function loadUsers() {

        fetch("/api/users")
            .then(response => response.json())
            .then(data => {

                const usersDiv = document.getElementById("users");

                usersDiv.innerHTML = "";

                data.forEach(user => {

                    const userElement = document.createElement("p");

                    userElement.textContent =
                        "ID: " + user.id +
                        " | Name: " + user.name +
                        " | Email: " + user.email +
                        " ";

                    const updateButton = document.createElement("button");

updateButton.textContent = "Update";

updateButton.addEventListener("click", function () {
    updateUser(user.id);
});

userElement.appendChild(updateButton);
const deleteButton = document.createElement("button");

deleteButton.textContent = "Delete";

deleteButton.addEventListener("click", function () {
    deleteUser(user.id);
});

userElement.appendChild(deleteButton);

                    usersDiv.appendChild(userElement);
                });

            })
            .catch(error => {
                console.error("Error loading users:", error);
            });
    }


    // CREATE - Add a new user
    const userForm = document.getElementById("userForm");

    userForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const name = document.getElementById("userName").value;
        const email = document.getElementById("userEmail").value;

        fetch("/api/users", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email
            })

        })
        .then(response => response.json())
        .then(data => {

            document.getElementById("message").textContent =
                "User added successfully!";

            userForm.reset();

            loadUsers();

        })
        .catch(error => {
            console.error("Error adding user:", error);
        });

    });


    // UPDATE - Update an existing user
    window.updateUser = function(id) {

        const newName = prompt("Enter new name:");

        if (!newName) {
            return;
        }

        const newEmail = prompt("Enter new email:");

        if (!newEmail) {
            return;
        }

        fetch("/api/users/" + id, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: newName,
                email: newEmail
            })

        })
        .then(response => response.json())
        .then(data => {

            alert("User updated successfully!");

            loadUsers();

        })
        .catch(error => {

            console.error("Error updating user:", error);

            alert("Failed to update user.");

        });

    }
// DELETE - Delete an existing user
window.deleteUser = function(id) {

    const confirmDelete = confirm("Are you sure you want to delete this user?");

    if (!confirmDelete) {
        return;
    }

    fetch("/api/users/" + id, {
        method: "DELETE"
    })
    .then(response => response.json())
    .then(data => {

        alert("User deleted successfully!");

        loadUsers();

    })
    .catch(error => {

        console.error("Error deleting user:", error);

        alert("Failed to delete user.");

    });
};
</script>

</body>
</html>
